<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBM Studio Pro Alpha 2</title>
<style>
:root{--navy:#082a5b;--blue:#1769d2;--bg:#e8eef5;--line:#d4dde7;--text:#17263d}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--bg);font-family:Arial,"Malgun Gothic",sans-serif;color:var(--text)}button,input,textarea{font:inherit}button{border:1px solid #c8d4df;background:#fff;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer}button:hover{background:#f2f6fa}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.app{height:100vh;display:grid;grid-template-rows:58px 1fr 28px}.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:900;color:var(--navy);min-width:210px}.brand small{display:block;color:#718096;font-size:10px}.top input{width:240px;border:1px solid #d2dce6;border-radius:8px;padding:8px}.actions{margin-left:auto;display:flex;gap:6px}.work{display:grid;grid-template-columns:260px minmax(650px,1fr) 290px;min-height:0}.side{background:#fff;overflow:auto;padding:12px}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}section{border-bottom:1px solid #e6ecf2;padding-bottom:12px;margin-bottom:12px}h3{font-size:12px;color:#627287;margin:0 0 9px;text-transform:uppercase}label{display:block;font-size:12px;font-weight:800;color:#607085;margin:7px 0}input,textarea{width:100%;margin-top:4px;border:1px solid #cbd6e1;border-radius:8px;padding:8px}textarea{min-height:65px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.center{display:grid;grid-template-rows:44px 1fr;min-width:0;background:#dbe4ee}.toolbar{display:flex;align-items:center;gap:7px;padding:0 10px;background:#f8fafc;border-bottom:1px solid #cbd6e1;overflow:auto}.toolbar button{padding:6px 8px;white-space:nowrap}.scroll{overflow:auto;padding:24px}.stage{position:relative;width:1200px;height:1350px;margin:auto;background:#eef3f8;box-shadow:0 18px 50px #1c314233;transform-origin:top left;overflow:hidden}.item{position:absolute;user-select:none}.item:not(.locked){cursor:move}.item.selected{outline:3px dashed #00a3ff;outline-offset:3px}.item.grouped::after{content:'G';position:absolute;right:4px;top:4px;background:#00a3ff;color:#fff;font-size:10px;border-radius:4px;padding:2px 4px}.card{width:100%;height:100%;background:#fff;border:1px solid #b8c5d3;border-radius:18px;overflow:hidden;box-shadow:0 7px 18px #102a4b1c}.head{height:58px;background:linear-gradient(135deg,var(--navy),#0e4c91);color:#fff;font-size:19px;font-weight:900;padding:17px}.body{padding:18px;white-space:pre-line;line-height:1.55;font-size:17px}.text{width:100%;height:100%;overflow:hidden;white-space:pre-line;font-weight:900}.badge{width:100%;height:100%;display:grid;place-items:center;border-radius:999px;background:#fff3d6;border:1px solid #ebcb82;color:#9a6504;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}.metric{background:#f4f7fb;border:1px solid #d5dee8;border-radius:10px;text-align:center;padding:9px}.metric small{display:block;color:#6b7b8f}.metric b{font-size:20px;color:var(--blue)}.layer{width:100%;display:grid;grid-template-columns:1fr 30px 30px;gap:3px;align-items:center;text-align:left;margin:3px 0}.layer.active{background:#e7f1fc;border-color:#68a2dc}.layer b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{padding:24px 10px;text-align:center;background:#f5f7fa;color:#8190a2;border-radius:9px}.status{background:var(--navy);color:#dbe8f7;padding:0 12px;display:flex;gap:18px;align-items:center;font-size:11px}.hint{font-size:11px;color:#6c7c90;line-height:1.5}.multi{padding:10px;background:#eef6ff;border-radius:8px;font-size:12px;font-weight:800;color:#2563a5}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">NBM Studio Pro<small>Desktop Alpha 2</small></div><input id="projectName" value="NBM Studio 프로젝트"><div class="actions"><button onclick="undo()">↶</button><button onclick="redo()">↷</button><button onclick="saveProject()">프로젝트 저장</button><button onclick="loadFile.click()">불러오기</button><input id="loadFile" type="file" accept=".nbm,.json" hidden><button class="primary" onclick="exportPNG()">PNG</button></div></header>
<div class="work">
<aside class="side left"><section><h3>요소 추가</h3><div class="grid"><button onclick="addText()">T 텍스트</button><button onclick="addCard()">▣ 카드</button><button onclick="addMetric()">123 지표</button><button onclick="addBadge()">★ 배지</button></div></section><section><h3>레이어</h3><div id="layers"></div></section></aside>
<main class="center"><div class="toolbar"><button onclick="groupSelected()">그룹</button><button onclick="ungroupSelected()">그룹 해제</button><button onclick="align('left')">왼쪽</button><button onclick="align('center')">가운데</button><button onclick="align('right')">오른쪽</button><button onclick="align('top')">위</button><button onclick="align('middle')">중앙</button><button onclick="align('bottom')">아래</button><button onclick="layerMove('front')">맨 앞으로</button><button onclick="layerMove('back')">맨 뒤로</button><label style="margin:0;white-space:nowrap">확대 <input id="zoom" type="range" min="35" max="100" value="58" style="width:90px;margin:0"><b id="zoomText">58%</b></label></div><div class="scroll"><div id="stage" class="stage"></div></div></main>
<aside class="side right"><h3>속성</h3><div id="properties" class="empty">요소를 선택하세요.</div><p class="hint">Shift+클릭 다중 선택<br>Ctrl+C / Ctrl+V 복사·붙여넣기<br>Ctrl+G 그룹 · Ctrl+Shift+G 해제<br>Delete 삭제 · Ctrl+Z 실행 취소<br>방향키 1px 이동, Shift+방향키 10px</p></aside>
</div>
<footer class="status"><span>● Ready</span><span>Alpha 2</span><span>1200 × 1350px</span><span id="count"></span></footer>
</div>
<script>
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const state={items:[],selected:new Set(),history:[],future:[],zoom:.58,clipboard:[]};
function seed(){return[{id:uid(),type:'text',name:'메인 제목',x:60,y:60,w:1080,h:110,text:'NBM Studio Pro\n금융 인포그래픽 편집기',fontSize:44,color:'#082a5b'},{id:uid(),type:'card',name:'핵심 요약',x:60,y:220,w:520,h:330,title:'핵심 요약',body:'• Shift 다중 선택\n• Ctrl+C / Ctrl+V\n• 그룹 및 정렬\n• 프로젝트 저장과 PNG 내보내기'},{id:uid(),type:'metrics',name:'투자 지표',x:620,y:220,w:520,h:330,title:'투자 지표',metrics:[['현재가','50,300원'],['목표가','56,000원'],['상승여력','11.3%'],['PER','15.2배'],['PBR','1.4배'],['ROE','12.8%']]},{id:uid(),type:'card',name:'긍정 요인',x:60,y:600,w:520,h:300,title:'긍정 요인',body:'• 브랜드 경쟁력\n• 수익성 개선\n• 해외시장 성장\n• 현금흐름 안정'},{id:uid(),type:'card',name:'위험 요인',x:620,y:600,w:520,h:300,title:'위험 요인',body:'• 원가와 환율\n• 시장 변동성\n• 실적 전망 오차\n• 단기 과열'},{id:uid(),type:'badge',name:'배지',x:430,y:980,w:340,h:70,text:'NBM Studio Alpha 2'}]}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function snapshot(){return JSON.stringify(state.items)}function push(){state.history.push(snapshot());if(state.history.length>80)state.history.shift();state.future=[]}function undo(){if(!state.history.length)return;state.future.push(snapshot());state.items=JSON.parse(state.history.pop());state.selected.clear();render()}function redo(){if(!state.future.length)return;state.history.push(snapshot());state.items=JSON.parse(state.future.pop());state.selected.clear();render()}
function itemHTML(it){if(it.type==='text')return `<div class="text" style="font-size:${it.fontSize}px;color:${it.color}">${esc(it.text)}</div>`;if(it.type==='badge')return `<div class="badge">${esc(it.text)}</div>`;if(it.type==='metrics')return `<div class="card"><div class="head">${esc(it.title)}</div><div class="metrics">${it.metrics.map(m=>`<div class="metric"><small>${esc(m[0])}</small><b>${esc(m[1])}</b></div>`).join('')}</div></div>`;return `<div class="card"><div class="head">${esc(it.title)}</div><div class="body">${esc(it.body)}</div></div>`}
function render(){const stage=$('stage');stage.style.transform=`scale(${state.zoom})`;stage.innerHTML='';state.items.forEach(it=>{if(it.hidden)return;const el=document.createElement('div');el.className='item'+(state.selected.has(it.id)?' selected':'')+(it.group?' grouped':'')+(it.locked?' locked':'');el.style.cssText=`left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px`;el.dataset.id=it.id;el.innerHTML=itemHTML(it);el.onpointerdown=e=>startDrag(e,it);stage.appendChild(el)});renderLayers();renderProps();$('count').textContent=`요소 ${state.items.length}개 · 선택 ${state.selected.size}개`;localStorage.setItem('nbm-alpha2',JSON.stringify({project:$('projectName').value,items:state.items}))}
function selectionFor(it){if(it.group)return state.items.filter(x=>x.group===it.group);return [it]}
function startDrag(e,it){e.stopPropagation();if(it.locked)return;if(e.shiftKey){state.selected.has(it.id)?state.selected.delete(it.id):selectionFor(it).forEach(x=>state.selected.add(x.id))}else if(!state.selected.has(it.id)){state.selected.clear();selectionFor(it).forEach(x=>state.selected.add(x.id))}render();push();const start={x:e.clientX,y:e.clientY,pos:new Map(state.items.filter(x=>state.selected.has(x.id)).map(x=>[x.id,{x:x.x,y:x.y}]))};window.onpointermove=ev=>{const dx=(ev.clientX-start.x)/state.zoom,dy=(ev.clientY-start.y)/state.zoom;state.items.filter(x=>state.selected.has(x.id)).forEach(x=>{const p=start.pos.get(x.id);x.x=Math.round(p.x+dx);x.y=Math.round(p.y+dy)});render()};window.onpointerup=()=>{window.onpointermove=window.onpointerup=null}}
$('stage').onpointerdown=e=>{if(e.target===$('stage')){state.selected.clear();render()}}
function renderLayers(){$('layers').innerHTML=[...state.items].reverse().map(it=>`<button class="layer ${state.selected.has(it.id)?'active':''}" onclick="layerSelect(event,'${it.id}')"><b>${esc(it.name)}</b><span onclick="event.stopPropagation();toggleLock('${it.id}')">${it.locked?'🔒':'🔓'}</span><span onclick="event.stopPropagation();toggleHide('${it.id}')">${it.hidden?'🙈':'👁'}</span></button>`).join('')}
function layerSelect(e,id){if(!e.shiftKey)state.selected.clear();state.selected.has(id)&&e.shiftKey?state.selected.delete(id):state.selected.add(id);render()}function toggleLock(id){push();const i=state.items.find(x=>x.id===id);i.locked=!i.locked;render()}function toggleHide(id){push();const i=state.items.find(x=>x.id===id);i.hidden=!i.hidden;render()}
function renderProps(){const box=$('properties'),sel=[...state.selected].map(id=>state.items.find(x=>x.id===id)).filter(Boolean);if(!sel.length){box.className='empty';box.innerHTML='요소를 선택하세요.';return}if(sel.length>1){box.className='multi';box.innerHTML=`${sel.length}개 요소 선택됨<br>정렬·그룹 기능을 사용할 수 있습니다.`;return}const it=sel[0];box.className='';box.innerHTML=`<label>이름<input value="${esc(it.name)}" onchange="patch('name',this.value)"></label><div class="grid"><label>X<input type="number" value="${it.x}" onchange="patch('x',+this.value)"></label><label>Y<input type="number" value="${it.y}" onchange="patch('y',+this.value)"></label><label>너비<input type="number" value="${it.w}" onchange="patch('w',+this.value)"></label><label>높이<input type="number" value="${it.h}" onchange="patch('h',+this.value)"></label></div>${it.type==='text'?`<label>텍스트<textarea onchange="patch('text',this.value)">${esc(it.text)}</textarea></label><label>크기<input type="number" value="${it.fontSize}" onchange="patch('fontSize',+this.value)"></label>`:''}${it.type==='card'?`<label>제목<input value="${esc(it.title)}" onchange="patch('title',this.value)"></label><label>본문<textarea onchange="patch('body',this.value)">${esc(it.body)}</textarea></label>`:''}<div class="grid"><button onclick="duplicate()">복제</button><button onclick="del()">삭제</button></div>`}
function patch(k,v){push();const it=state.items.find(x=>state.selected.has(x.id));if(it)it[k]=v;render()}function del(){if(!state.selected.size)return;push();state.items=state.items.filter(x=>!state.selected.has(x.id));state.selected.clear();render()}function copy(){state.clipboard=[...state.selected].map(id=>JSON.parse(JSON.stringify(state.items.find(x=>x.id===id))))}function paste(){if(!state.clipboard.length)return;push();state.selected.clear();const gm={};state.clipboard.forEach(o=>{const n=JSON.parse(JSON.stringify(o));n.id=uid();n.x+=20;n.y+=20;n.name+=' 복사';if(n.group){gm[n.group]??=uid();n.group=gm[n.group]}state.items.push(n);state.selected.add(n.id)});render()}function duplicate(){copy();paste()}
function groupSelected(){if(state.selected.size<2)return;push();const g=uid();state.items.filter(x=>state.selected.has(x.id)).forEach(x=>x.group=g);render()}function ungroupSelected(){push();const gs=new Set(state.items.filter(x=>state.selected.has(x.id)).map(x=>x.group).filter(Boolean));state.items.forEach(x=>{if(gs.has(x.group))delete x.group});render()}
function align(mode){const a=state.items.filter(x=>state.selected.has(x.id));if(a.length<2)return;push();const minX=Math.min(...a.map(x=>x.x)),maxR=Math.max(...a.map(x=>x.x+x.w)),minY=Math.min(...a.map(x=>x.y)),maxB=Math.max(...a.map(x=>x.y+x.h));a.forEach(x=>{if(mode==='left')x.x=minX;if(mode==='center')x.x=(minX+maxR-x.w)/2;if(mode==='right')x.x=maxR-x.w;if(mode==='top')x.y=minY;if(mode==='middle')x.y=(minY+maxB-x.h)/2;if(mode==='bottom')x.y=maxB-x.h});render()}
function layerMove(mode){if(!state.selected.size)return;push();const s=state.items.filter(x=>state.selected.has(x.id)),r=state.items.filter(x=>!state.selected.has(x.id));state.items=mode==='front'?[...r,...s]:[...s,...r];render()}
function add(o){push();o.id=uid();state.items.push(o);state.selected.clear();state.selected.add(o.id);render()}function addText(){add({type:'text',name:'새 텍스트',x:140,y:140,w:360,h:80,text:'새 텍스트',fontSize:34,color:'#082a5b'})}function addCard(){add({type:'card',name:'새 카드',x:140,y:140,w:400,h:280,title:'카드 제목',body:'• 내용을 입력하세요\n• 항목을 추가하세요'})}function addMetric(){add({type:'metrics',name:'새 지표',x:140,y:140,w:460,h:280,title:'투자 지표',metrics:[['매출','100억'],['영업익','20억'],['PER','15배'],['PBR','1.5배'],['ROE','12%'],['배당','2%']]})}function addBadge(){add({type:'badge',name:'새 배지',x:140,y:140,w:220,h:60,text:'핵심 배지'})}
function saveProject(){download(new Blob([JSON.stringify({version:'alpha2',project:$('projectName').value,items:state.items},null,2)],{type:'application/json'}),$('projectName').value+'.nbm')}$('loadFile').onchange=()=>{const f=$('loadFile').files[0];if(!f)return;const r=new FileReader;r.onload=()=>{const d=JSON.parse(r.result);state.items=d.items||[];$('projectName').value=d.project||'NBM 프로젝트';state.selected.clear();render()};r.readAsText(f)}
function exportPNG(){const clone=$('stage').cloneNode(true);clone.style.transform='none';clone.querySelectorAll('.item').forEach(x=>x.classList.remove('selected','grouped'));const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350"><foreignObject width="1200" height="1350"><div xmlns="http://www.w3.org/1999/xhtml">${document.querySelector('style').outerHTML}${clone.outerHTML}</div></foreignObject></svg>`;const img=new Image,blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob);img.onload=()=>{const c=document.createElement('canvas');c.width=2400;c.height=2700;const ctx=c.getContext('2d');ctx.scale(2,2);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>download(b,'NBM-export.png'),'image/png')};img.src=url}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('zoom').oninput=e=>{state.zoom=+e.target.value/100;$('zoomText').textContent=e.target.value+'%';render()};window.onkeydown=e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){e.preventDefault();copy()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){e.preventDefault();paste()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='g'){e.preventDefault();e.shiftKey?ungroupSelected():groupSelected()}else if(e.key==='Delete'){del()}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();push();const d=e.shiftKey?10:1;state.items.filter(x=>state.selected.has(x.id)).forEach(x=>{if(e.key==='ArrowLeft')x.x-=d;if(e.key==='ArrowRight')x.x+=d;if(e.key==='ArrowUp')x.y-=d;if(e.key==='ArrowDown')x.y+=d});render()}};
const saved=localStorage.getItem('nbm-alpha2');if(saved){try{const d=JSON.parse(saved);state.items=d.items||seed();$('projectName').value=d.project||$('projectName').value}catch{state.items=seed()}}else state.items=seed();render();
</script>
</body>
</html>
